<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ChatGPT Clone</title>

<style>
body {
    margin: 0;
    background: #343541;
    color: white;
    font-family: Arial, sans-serif;
    height: 100vh;
    display: flex;
}

.sidebar {
    width: 240px;
    background: #202123;
    padding: 16px;
}

.chat {
    flex: 1;
    display: flex;
    flex-direction: column;
}

.chat-box {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
}

.message {
    max-width: 75%;
    padding: 12px;
    margin-bottom: 12px;
    border-radius: 8px;
    line-height: 1.5;
}

.user {
    background: #0b5cff;
    margin-left: auto;
}

.assistant {
    background: #444654;
    margin-right: auto;
}

.input-box {
    display: flex;
    padding: 12px;
    background: #40414f;
}

textarea {
    flex: 1;
    resize: none;
    padding: 10px;
    border-radius: 6px;
    border: none;
    outline: none;
    font-size: 15px;
}

button {
    margin-left: 8px;
    padding: 10px 18px;
    background: #19c37d;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="sidebar">
    <h3>ChatGPT Clone</h3>
    <p>API Key Based</p>
</div>

<div class="chat">
    <div id="chatBox" class="chat-box"></div>

    <div class="input-box">
        <textarea id="input" rows="2" placeholder="Send a message..."></textarea>
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
const API_KEY = "YOUR_OPENAI_API_KEY"; // 

// ✅ Conversation memory (THIS is the key difference)
const messages = [
    { role: "system", content: "You are a helpful assistant." }
];

async function sendMessage() {
    const input = document.getElementById("input");
    const chatBox = document.getElementById("chatBox");

    if (!input.value.trim()) return;

    const userText = input.value;
    input.value = "";

    // UI
    addMessage(userText, "user");

    // Save to conversation
    messages.push({ role: "user", content: userText });

    // Typing indicator
    const typing = addMessage("Typing...", "assistant");

    const response = await fetch("https://api.openai.com/v1/chat/completions", {
        method: "POST",
        headers: {
            "Authorization": `Bearer ${API_KEY}`,
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            model: "gpt-4o-mini",
            messages: messages
        })
    });

    const data = await response.json();
    const reply = data.choices[0].message.content;

    // Remove typing
    typing.remove();

    // Show reply
    addMessage(reply, "assistant");

    // ✅ Save assistant response (VERY IMPORTANT)
    messages.push({ role: "assistant", content: reply });
}

function addMessage(text, role) {
    const chatBox = document.getElementById("chatBox");
    const div = document.createElement("div");
    div.className = `message ${role}`;
    div.textContent = text;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
    return div;
}
</script>

</body>
</html>
